[project]
name = "lyra"
version = "0.1.0"
description = "Run a Hugging Face language model too big for one machine by splitting its layers across several, over Tailscale"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "psutil>=7.2.2",
    "safetensors>=0.8.0",
    "textual>=8.2.8",
    "torch==2.14.1",
    "transformers==5.20.2",
]

[project.urls]
Repository = "https://github.com/muwasifk/lyra"

[project.scripts]
lyra = "lyra.__main__:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120  # what the code was already written to

[tool.ruff.lint]
ignore = [
    "BLE001",  # catching Exception: the TUI's background threads must show any error in the log, not die silently
    "RUF012",  # mutable class attributes: how Textual declares BINDINGS
]
